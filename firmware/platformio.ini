; KrishiChain node firmware
;
; Environments:
;   node-farm     harvest node        -> pio run -e node-farm -t upload
;   node-transit  cold-chain node     -> pio run -e node-transit -t upload
;   native        host-side tests     -> pio test -e native
;
; The `native` env is the one that matters most day to day: it runs the canonical-encoding
; and hash-chain tests against packages/core/fixtures/vectors.json with no board attached,
; so H1 can develop the whole protocol layer before any hardware exists.

[platformio]
default_envs = node-transit
; Two firmware targets live side by side (node-farm/, node-transit/), so there is no single
; `src/` for PlatformIO to find — it looked for firmware/src, found nothing, and failed with
; "Nothing to build". PlatformIO has no per-environment src_dir, so the standard pattern is
; to root src_dir here and have each environment select its own sources with
; build_src_filter. lib_dir and test_dir are separate settings and still resolve normally.
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DKRISHI_PROTOCOL_VERSION=1
build_unflags = -std=gnu++11
lib_deps =
    ; Ticket H1-01/H1-04: secp256k1 signing. micro-ecc is the small, proven option.
    kmackay/micro-ecc @ ^1.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.13
    bblanchon/ArduinoJson @ ^7.2.0

[env:node-farm]
platform = espressif32
board = esp32dev
; Only this node's sources; the other node's main() would collide.
build_src_filter = +<node-farm/src/>
build_flags =
    ${env.build_flags}
    -DKRISHI_NODE_FARM
    -DKRISHI_SAMPLE_INTERVAL_MS=30000
board_build.partitions = partitions.csv

[env:node-transit]
platform = espressif32
board = esp32dev
build_src_filter = +<node-transit/src/>
build_flags =
    ${env.build_flags}
    -DKRISHI_NODE_TRANSIT
    -DKRISHI_SAMPLE_INTERVAL_MS=30000
board_build.partitions = partitions.csv

; Host-side unit tests. No Arduino, no board — just the pure protocol code.
[env:native]
platform = native
; Build nothing from src: the host test supplies its own main(), and with src_dir rooted at
; firmware/ the default filter would try to compile BOTH nodes' Arduino sources natively.
build_src_filter = -<*>
; Unset the `framework = arduino` inherited from [env]. The native platform has no board,
; and PlatformIO answers an Arduino build with no board by refusing to build at all
; ("Please specify `board` in `platformio.ini`"). An empty value overrides the inheritance;
; omitting the key just inherits it again.
framework =
build_flags =
    -std=gnu++17
    -DKRISHI_NATIVE
    -DKRISHI_PROTOCOL_VERSION=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
lib_compat_mode = off
test_framework = unity
