; KrishiChain node firmware
;
; Environments:
;   node-farm     harvest node        -> pio run -e node-farm -t upload
;   node-transit  cold-chain node     -> pio run -e node-transit -t upload
;   native        host-side tests     -> pio test -e native
;
; The `native` env is the one that matters most day to day: it runs the canonical-encoding
; and hash-chain tests against packages/core/fixtures/vectors.json with no board attached,
; so H1 can develop the whole protocol layer before any hardware exists.

[platformio]
default_envs = node-transit

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DKRISHI_PROTOCOL_VERSION=1
build_unflags = -std=gnu++11
lib_deps =
    ; Ticket H1-01/H1-04: secp256k1 signing. micro-ecc is the small, proven option.
    kmackay/micro-ecc @ ^1.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.13
    bblanchon/ArduinoJson @ ^7.2.0

[env:node-farm]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DKRISHI_NODE_FARM
    -DKRISHI_SAMPLE_INTERVAL_MS=30000
board_build.partitions = partitions.csv

[env:node-transit]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DKRISHI_NODE_TRANSIT
    -DKRISHI_SAMPLE_INTERVAL_MS=30000
board_build.partitions = partitions.csv

[env:node-leaf]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -DKRISHI_NODE_LEAF
    -DKRISHI_SAMPLE_INTERVAL_MS=30000
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = partitions-4mb.csv
lib_deps =
    ${env.lib_deps}

[env:node-cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DKRISHI_NODE_CAM
    -DKRISHI_SAMPLE_INTERVAL_MS=60000
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.partitions = partitions-4mb.csv
board_build.arduino.memory_type = qio_opi
lib_deps =
    ${env.lib_deps}

; Host-side unit tests. No Arduino, no board — just the pure protocol code.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DKRISHI_NATIVE
    -DKRISHI_PROTOCOL_VERSION=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
lib_compat_mode = off
test_framework = unity
