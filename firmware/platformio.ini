; KrishiChain node firmware
;
;   pio run -e node-head -t upload      HEAD: WiFi uplink + ESP-NOW receiver (ESP32 DevKit)
;   pio run -e node-leaf -t upload      LEAF: ESP-NOW + WiFi-direct failover (S2 Lolin Mini)
;   pio run -e node-cam -t upload       WITNESS: photo hash + lid verdict (AI Thinker ESP32-CAM)
;   pio run -e cam-bringup -t upload    CAM bring-up sketch, no lib/krishi
;   pio test -e native                  host tests, no board required
;
; Platform: the OFFICIAL platformio/espressif32 (Arduino core 2.x), not pioarduino.
;
; This was deliberately reconsidered during the H1+H2 merge (2026-09-08). H1's plan
; originally moved to pioarduino/platform-espressif32 (core 3.x / IDF 5.x) for the
; newer esp_now_recv_info_t callback signature. Two things changed that call:
;   1. This project only ever uses ESP-NOW v1 (<=250-byte payloads, see
;      docs/PROTOCOL-LINK.md section 1) - v1 needs no IDF-5-only API. The only real
;      difference core 2.x vs 3.x makes here is the receive-callback signature, which
;      firmware/lib/krishi/link/espnow.h already shims both ways at compile time
;      (see KRISHI_RECV_FN in that file) - that shim exists specifically so this
;      decision is reversible without touching node-head's code.
;   2. H2's node-leaf/node-cam register the OLD (core 2.x) callback signature directly,
;      unshimmed, and that code is the one already flashed and tested on real S2 Lolin
;      / ESP32-CAM hardware. Forcing it onto core 3.x breaks it outright.
;   3. pioarduino's Arduino-ESP32 3.3.11 core-libs archive contains a path
;      (.../connectedhomeip/.../camera-av-settings-user-level-management-server.h)
;      longer than Windows' default MAX_PATH, so it fails to unpack on Windows without
;      long-path support enabled system-wide. The official platform has no such path.
; If ESP-NOW v2 (>250 byte frames) is ever needed, revisit both this platform pin and
; the node-leaf/node-cam callback registrations together, in the same change.

[platformio]
default_envs = node-head
src_dir = .
test_dir = test
lib_dir = lib
libdeps_dir = .pio/libdeps

[env]
platform = espressif32@6.9.0
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DKRISHI_PROTOCOL_VERSION=1
    ; kmackay/micro-ecc's uECC_* symbols (uECC_set_rng, uECC_secp256r1, etc.) collide
    ; at link time with the Arduino-ESP32 framework's own copy of the same names,
    ; bundled into libbt.a for its BLE Mesh stack's tinycrypt-derived ECC. This
    ; project never uses Bluetooth, but libbt.a is linked into every classic-ESP32
    ; Arduino sketch regardless (node-head, node-cam - ESP32-S2 has no BT hardware
    ; at all, so node-leaf never hits this). Two libraries defining the same global
    ; C symbol names is a genuine conflict, not a bug in either one; the linker
    ; can't guess which definition we mean, so tell it ours (linked first) wins.
    -Wl,--allow-multiple-definition
build_unflags = -std=gnu++11
lib_deps =
    kmackay/micro-ecc @ ^1.0

[env:node-head]
board = esp32dev
framework = arduino
build_src_filter = +<node-head/src/>
build_flags =
    ${env.build_flags}
    -DKRISHI_ROLE_HEAD
board_build.partitions = partitions.csv

[env:node-leaf]
board = lolin_s2_mini
framework = arduino
build_src_filter = +<node-leaf/src/>
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -DKRISHI_ROLE_LEAF
    -DKRISHI_SAMPLE_INTERVAL_MS=30000
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = partitions-4mb.csv

[env:cam-bringup]
board = esp32cam
framework = arduino
build_src_filter = +<cam-bringup/src/>
build_flags =
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions-4mb.csv

[env:node-cam]
board = esp32cam
framework = arduino
build_src_filter = +<node-cam/src/>
build_flags =
    ${env.build_flags}
    -DKRISHI_ROLE_CAM
    -DKRISHI_SAMPLE_INTERVAL_MS=60000
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.partitions = partitions-4mb.csv

; Host tests. No Arduino, no radio - the pure protocol code only.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DKRISHI_NATIVE
    -DKRISHI_PROTOCOL_VERSION=1
    -DUNITY_INCLUDE_64
lib_deps =
    kmackay/micro-ecc @ ^1.0
    bblanchon/ArduinoJson @ ^7.2.0
lib_compat_mode = off
test_framework = unity
