# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- KrishiChain runtime config -------------------------------------------------------------
# Fed into BuildConfig fields by app/build.gradle.kts. Defaults mirror .env.example at the repo
# root (NEXT_PUBLIC_GATEWAY_URL / NEXT_PUBLIC_VERIFY_RPC_URL / NEXT_PUBLIC_VERIFY_CHAIN_ID), with
# "localhost" translated to 10.0.2.2 — the standard Android-emulator alias for the host's
# localhost (a real device would need the host's LAN IP instead). Override any of these per build
# with -PkrishichainGatewayUrl=... etc., e.g. when running the gateway on a non-default port:
#   ./gradlew installDebug -PkrishichainGatewayUrl=http://10.0.2.2:8081
krishichainGatewayUrl=http://10.0.2.2:8080
krishichainVerifyRpcUrl=https://rpc-amoy.polygon.technology
krishichainVerifyChainId=80002
# BatchAnchor address is intentionally blank — nothing is deployed to any network in this repo
# yet. An empty string renders the same honest "not deployed / not configured" state the web
# app's VerifyPanel.tsx shows, never a fake green tick.
krishichainBatchAnchorAddress=
